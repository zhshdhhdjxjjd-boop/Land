<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land™</title>
<style>
:root{--bg:#f6f3ec;--fg:#23201a;--card:#fff;--ac:#2f8f5b;--mu:#8a8473;--bd:#e3ddcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150f;--fg:#f1ede2;--card:#222018;--mu:#a29c88;--bd:#3a372b}}
:root[data-theme="dark"]{--bg:#16150f;--fg:#f1ede2;--card:#222018;--mu:#a29c88;--bd:#3a372b}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1{text-align:center;font-size:2rem;margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:1rem;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row>button{flex:1}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.pick button{padding:4px;background:var(--bg);border:2px solid transparent}
.pick button.on{border-color:var(--ac)}
.pl{text-align:center;font-size:.85rem;min-width:70px}
.pl.me{font-weight:700}
.big{font-size:1.15rem;text-align:center;margin:10px 0}
.mu{color:var(--mu);font-size:.85rem;text-align:center}
.code{font-size:1.6rem;letter-spacing:4px;font-weight:800;text-align:center;direction:ltr}
.err{color:#c0392b;text-align:center;margin:8px 0}
.gb{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);color:var(--fg);border:2px solid var(--bd)}
</style></head><body><main>
<h1>Land™</h1><div id="cv" style="display:none;margin-bottom:12px;border-radius:16px;overflow:hidden;background:linear-gradient(#cfe8ff,#eaf5e4)"></div><div id="app"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CH=[["#e8a15b","cat"],["#9aa0a6","bear"],["#f2c9d0","bunny"],["#d9682b","fox"],["#6bb36f","frog"],["#7a8ee0","owl"]];
function av(i,s=56){const c=CH[i][0],k=CH[i][1];
const ears=k=="cat"||k=="fox"?`<path d="M14 30 18 6 34 20ZM66 30 62 6 46 20Z" fill="${c}"/>`:k=="bunny"?`<ellipse cx="27" cy="14" rx="6" ry="14" fill="${c}"/><ellipse cx="53" cy="14" rx="6" ry="14" fill="${c}"/>`:k=="frog"?`<circle cx="26" cy="22" r="10" fill="${c}"/><circle cx="54" cy="22" r="10" fill="${c}"/>`:`<circle cx="18" cy="22" r="9" fill="${c}"/><circle cx="62" cy="22" r="9" fill="${c}"/>`;
const eye=k=="owl"?`<circle cx="30" cy="44" r="9" fill="#fff"/><circle cx="50" cy="44" r="9" fill="#fff"/><circle cx="30" cy="44" r="4" fill="#222"/><circle cx="50" cy="44" r="4" fill="#222"/>`:`<circle cx="30" cy="44" r="3.5" fill="#222"/><circle cx="50" cy="44" r="3.5" fill="#222"/>`;
const mouth=k=="owl"?`<path d="M36 56 40 64 44 56Z" fill="#e8a13a"/>`:k=="bunny"||k=="cat"||k=="fox"?`<path d="M37 56h6l-3 4Z" fill="#d46a7e"/><path d="M33 62q7 5 14 0" stroke="#222" fill="none" stroke-width="2"/>`:`<path d="M32 58q8 7 16 0" stroke="#222" fill="none" stroke-width="2.5"/>`;
return`<svg width="${s}" height="${s}" viewBox="0 0 80 80">${ears}<circle cx="40" cy="48" r="28" fill="${c}"/>${eye}${mouth}</svg>`}
const $=id=>document.getElementById(id),A=$('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me={id:Math.random().toString(36).slice(2,8),name:"",ch:0},S=null,R=null,isHost=false,code="",err="",sel=0;
const P=id=>S.players.find(p=>p.id==id);
function login(){
A.innerHTML=`<div class="card"><input id="nm" placeholder="اسمك" maxlength="14" value="${esc(me.name)}">
<div class="pick">${CH.map((_,i)=>`<button data-i="${i}" class="${i==sel?'on':''}">${av(i,40)}</button>`).join("")}</div>
<button style="width:100%" id="mk">أنشئ غرفة</button></div>
<div class="card"><input id="cd" placeholder="رقم الغرفة (ID)" maxlength="5" style="direction:ltr;text-transform:uppercase">
<button class="alt" style="width:100%" id="jn">انضم لغرفة</button></div><div class="err">${err}</div>`;
A.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{me.name=$('nm').value;sel=+b.dataset.i;login()});
$('mk').onclick=()=>enter(true);$('jn').onclick=()=>enter(false)}
const DB="https://conserol-default-rtdb.firebaseio.com";
async function fb(path,method="GET",body){
const r=await fetch(`${DB}/rooms/${code}${path?"/"+path:""}.json`,{method,body:body===undefined?undefined:JSON.stringify(body)});
const j=await r.json();if(j&&j.error)throw new Error(j.error);return j}
const norm=s=>{if(s){s.lose=s.lose||{};s.players=Object.values(s.players||{})}return s};
let last="",busy=false;
async function enter(host){
me.name=$('nm').value.trim()||"لاعب";me.ch=sel;
code=host?Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join(""):$('cd').value.trim().toUpperCase();
if(!code)return;
isHost=host;A.innerHTML='<p class="big">جاري الاتصال...</p>';
try{
if(host){S={players:[me],locked:false,phase:"lobby",back:null,poker:null,res:null,lose:{}};
await fb("acts","DELETE");await fb("rtc","DELETE");await fb("state","PUT",S);render()}
else{const s=norm(await fb("state"));if(!s){err="ما لقينا الغرفة";return login()}S=s;render()}
setInterval(tick,900)}
catch(e){err="تعذر الاتصال بقاعدة البيانات: "+e.message;login()}}
async function tick(){if(busy)return;busy=true;try{
if(isHost){const a=await fb("acts");if(a)for(const k of Object.keys(a).sort()){await fb("acts/"+k,"DELETE");handle(a[k])}}
else{const s=norm(await fb("state"));if(s){const j=JSON.stringify(s);S=s;if(j!=last){last=j;render()}
if(!P(me.id)&&!S.locked)await fb("acts","POST",{t:"join",p:me})}}
await rtcTick();}catch(e){}busy=false}
const bc=()=>{fb("state","PUT",S).catch(()=>{});render()};
const act=d=>isHost?handle(d):fb("acts","POST",d).catch(()=>{});
function handle(d){
if(d.t=="join"&&!S.locked&&S.players.length<3&&!P(d.p.id)){S.players.push(d.p);
if(S.players.length==3){S.locked=true;S.phase="play";S.back=S.players[Math.random()*3|0].id}bc()}
else if(d.t=="poke"&&S.phase=="play"&&d.from!=S.back&&P(d.from)){S.poker=d.from;S.phase="guess";bc()}
else if(d.t=="guess"&&S.phase=="guess"&&d.from==S.back){const ok=d.g==S.poker,b=S.back;
if(!ok)S.lose[b]=(S.lose[b]||0)+1;S.res={ok,poker:S.poker,back:b};S.phase="result";bc();
setTimeout(()=>{if(ok)S.back=S.poker;S.poker=null;S.res=null;S.phase="play";bc()},3500)}}
function render(){
if(!S)return;initScene();
if(!P(me.id)&&S.locked){return A.innerHTML='<p class="big">الغرفة ممتلئة</p>'}
const bk=S.back,amB=bk==me.id;
let h=`<div class="card"><div class="mu">رقم الغرفة</div><div class="code">${code}</div>
<div class="row" style="margin-top:8px"><button class="alt" id="cp" style="flex:0">نسخ</button></div></div>
<div class="card"><div class="row">${S.players.map(p=>`<div class="pl ${p.id==me.id?'me':''}" style="${p.id==bk?'outline:2px solid var(--ac);border-radius:12px':''}">${av(p.ch)}<div>${esc(p.name)}${p.id==me.id?' (أنت)':''}</div><div class="mu">خسارات: ${S.lose[p.id]||0}</div></div>`).join("")}</div></div><div class="card">`;
if(S.phase=="lobby")h+=`<p class="big">بانتظار اللاعبين (${S.players.length}/3)</p><p class="mu">أعطِ الرقم لأصدقائك. الغرفة تنقفل عند اكتمال ٣.</p>`;
else if(S.phase=="play")h+=amB?`<p class="big">ظهرك لهم... انتظر النغزة</p>`:`<p class="big">${esc(P(bk).name)} معطيكم ظهره</p><button style="width:100%" id="pk">انغزه</button>`;
else if(S.phase=="guess"){if(amB){const o=S.players.filter(p=>p.id!=me.id);h+=`<p class="big">نغزك أحدهم! مين هو؟ (محاولة وحدة)</p><div class="row">${o.map(p=>`<button class="gb" data-g="${p.id}">${av(p.ch,52)}${esc(p.name)}</button>`).join("")}</div>`}else h+=`<p class="big">تم النغز! ننتظر تخمينه...</p>`}
else{const r=S.res,pk=P(r.poker),b=P(r.back);h+=r.ok?`<p class="big">${esc(b.name)} خمّن صح! الناغز ${esc(pk.name)} يعطي ظهره الآن</p>`:`<p class="big">غلط! الناغز كان ${esc(pk.name)}، و${esc(b.name)} يبقى ظهره</p>`}
A.innerHTML=h+`</div><div class="card"><button style="width:100%" id="mc" class="${mic&&!muted?'':'alt'}">${!mic?'تفعيل المايك':muted?'إلغاء الكتم':'كتم المايك'}</button><div class="mu" style="margin-top:6px">${mic?'المايك شغّال، تقدر تسولف مع الباقين':'اضغط لتتكلم وتسمع اللاعبين'}</div></div>`;
$('mc').onclick=()=>{if(!mic)micOn();else{muted=!muted;mic.getAudioTracks()[0].enabled=!muted;render()}};
$('cp').onclick=()=>{try{navigator.clipboard.writeText(code);$('cp').textContent="تم"}catch(e){}};
const pk=$('pk');if(pk)pk.onclick=()=>act({t:"poke",from:me.id});
A.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>act({t:"guess",from:me.id,g:b.dataset.g}))}
let T=null;
function lab(n){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 34px sans-serif';x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='#222';x.lineWidth=6;x.strokeText(n,128,44);x.fillText(n,128,44);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(2,.5,1);s.position.y=2.7;return s}
function mk(p){const k=CH[p.ch][1],g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:new THREE.Color(CH[p.ch][0])}),dk=new THREE.MeshLambertMaterial({color:0x222222}),wh=new THREE.MeshLambertMaterial({color:0xffffff});
const sp=(r,x,y,z,mt)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),mt||m);o.position.set(x,y,z);g.add(o);return o};
sp(.55,0,.55,0).scale.y=1.15;sp(.5,0,1.4,0);
if(k=="owl"){sp(.17,-.2,1.45,.42,wh);sp(.17,.2,1.45,.42,wh)}
const ez=k=="owl"?.57:.49;sp(.07,-.2,1.45,ez,dk);sp(.07,.2,1.45,ez,dk);sp(.07,0,1.3,.5,dk);
[-1,1].forEach(d=>{let e;
if(k=="cat"||k=="fox"){e=new THREE.Mesh(new THREE.ConeGeometry(.18,.45,12),m);e.position.set(d*.3,1.95,0)}
else if(k=="bunny"){e=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.7,10),m);e.position.set(d*.2,2.1,0)}
else{e=new THREE.Mesh(new THREE.SphereGeometry(.17,12,10),m);e.position.set(d*.35,1.85,0)}
g.add(e)});
const bf=new THREE.Group(),bm=new THREE.MeshLambertMaterial({color:0x7a1f2b}),bd=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.24,24),bm);bd.position.y=1.45;bf.add(bd);
const kn=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),bm);kn.position.set(0,1.45,-.6);bf.add(kn);
const tl=new THREE.Mesh(new THREE.BoxGeometry(.12,.35,.05),bm);tl.position.set(.1,1.25,-.62);tl.rotation.z=.4;bf.add(tl);
bf.visible=false;g.add(bf);g.userData.bf=bf;
g.add(lab(p.name));return g}
function initScene(){if(T)return;const cv=$('cv');cv.style.display='block';
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,50),rn=new THREE.WebGLRenderer({antialias:true,alpha:true});cv.appendChild(rn.domElement);
sc.add(new THREE.HemisphereLight(0xffffff,0x6b8f5b,.9));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(3,6,4);sc.add(dl);
const g=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,.3,48),new THREE.MeshLambertMaterial({color:0x58a65c}));g.position.y=-.15;sc.add(g);
T={sc,ch:{}};cam.position.set(0,3.6,7.5);cam.lookAt(0,.9,0);
const rs=()=>{const w=cv.clientWidth,h=Math.round(w*.8);rn.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()};rs();addEventListener('resize',rs);
(function loop(t){requestAnimationFrame(loop);sync(t/1000);rn.render(sc,cam)})(0)}
function sync(t){if(!S)return;$("cv").style.filter=(S.phase=="play"||S.phase=="guess")&&S.back==me.id?"brightness(.1)":"none";const play=S.phase!="lobby",bk=S.back,oth=S.players.filter(p=>p.id!=bk);
S.players.forEach((p,i)=>{let o=T.ch[p.id];if(!o){o=T.ch[p.id]=mk(p);o.position.set(0,0,-3);T.sc.add(o)}
o.userData.bf.visible=play&&p.id==bk&&S.phase!="result";let x,z,ry=0,y=0;
if(!play){x=(i-1)*1.8;z=0}
else if(p.id==bk){x=0;z=1.3;if(S.phase=="result")ry=Math.PI}
else{x=oth.indexOf(p)?1.6:-1.6;z=-1.4;if(S.poker==p.id&&(S.phase=="result"||(S.phase=="guess"&&bk!=me.id))){z=.3;x*=.3;y=Math.abs(Math.sin(t*6))*.25}}
o.position.x+=(x-o.position.x)*.1;o.position.z+=(z-o.position.z)*.1;o.position.y=y;o.rotation.y+=(ry-o.rotation.y)*.1})}
let mic=null,muted=false,PC={};
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
async function micOn(){try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});render()}catch(e){alert("ما قدرنا نفتح المايك، تأكد من إعطاء الإذن للمتصفح")}}
function mkPC(o,k){const c=new RTCPeerConnection(ICE);mic.getTracks().forEach(t=>c.addTrack(t,mic));
const a=new Audio();a.autoplay=true;document.body.appendChild(a);
c.ontrack=e=>{a.srcObject=e.streams[0];a.play().catch(()=>{})};
c.onicecandidate=ev=>{if(ev.candidate)fb(`rtc/${k}/ice_${me.id}`,"POST",ev.candidate.toJSON()).catch(()=>{})};
return{c,seen:{}}}
async function rtcTick(){if(!mic||!S)return;const all=(await fb("rtc"))||{};
for(const p of S.players){const o=p.id;if(o==me.id)continue;
const k=me.id<o?me.id+"_"+o:o+"_"+me.id,d=all[k]||{},e=PC[o]||(PC[o]=mkPC(o,k));
if(me.id<o){
if(!e.sent){e.sent=1;const of=await e.c.createOffer();await e.c.setLocalDescription(of);await fb(`rtc/${k}/offer`,"PUT",{sdp:of.sdp,type:of.type})}
else if(d.answer&&!e.rem){e.rem=1;await e.c.setRemoteDescription(d.answer)}
}else if(d.offer&&!e.sent){e.sent=1;await e.c.setRemoteDescription(d.offer);e.rem=1;const an=await e.c.createAnswer();await e.c.setLocalDescription(an);await fb(`rtc/${k}/answer`,"PUT",{sdp:an.sdp,type:an.type})}
const ri=d["ice_"+o];
if(ri&&e.rem)for(const id of Object.keys(ri))if(!e.seen[id]){e.seen[id]=1;await e.c.addIceCandidate(ri[id]).catch(()=>{})}}}
login();
</script></body></html>
